name: physics-world

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: physics_world
      POSTGRES_PASSWORD: physics_world
      POSTGRES_DB: physics_world
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physics_world -d physics_world"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  auth-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        SERVICE: auth-service
    environment:
      AUTH_BIND_ADDR: 0.0.0.0:8081
      # Local deployments terminate TLS elsewhere; the browser talks plain HTTP.
      AUTH_COOKIE_SECURE: "false"
      RUST_LOG: info
      DATABASE_URL: postgres://physics_world:physics_world@postgres:5432/physics_world
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        SERVICE: user-api
    environment:
      USER_API_BIND_ADDR: 0.0.0.0:8082
      RUST_LOG: info
      DATABASE_URL: postgres://physics_world:physics_world@postgres:5432/physics_world
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8082"
    depends_on:
      auth-service:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  user-api-sse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        SERVICE: user-api-sse
    environment:
      PORT: "8085"
      RUST_LOG: info
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8085"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  recommendation-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        SERVICE: recommendation-service
    environment:
      REC_PORT: "8086"
      RUST_LOG: info
      DATABASE_URL: postgres://physics_world:physics_world@postgres:5432/physics_world
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  battle-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        SERVICE: battle-service
    environment:
      BATTLE_BIND_ADDR: 0.0.0.0:8087
      RUST_LOG: info
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8087"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      GATEWAY_PORT: "8080"
      AUTH_UPSTREAM: auth-service:8081
      USER_API_UPSTREAM: user-api:8082
      SSE_UPSTREAM: user-api-sse:8085
      REC_UPSTREAM: recommendation-service:8086
      BATTLE_UPSTREAM: battle-service:8087
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-api
      - user-api-sse
      - recommendation-service
      - battle-service
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
