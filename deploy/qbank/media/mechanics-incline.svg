<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Block sliding down an inclined plane">
  <rect width="640" height="400" fill="#f8fafc"/>
  <line x1="80" y1="330" x2="560" y2="330" stroke="#94a3b8" stroke-width="3"/>
  <path d="M80 330 L440 330 L80 120 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
  <g transform="rotate(30 150 330)">
    <rect x="150" y="268" width="96" height="60" rx="6" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  </g>
  <line x1="222" y1="296" x2="222" y2="208" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="246" y1="290" x2="322" y2="238" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="200" y="192" fill="#dc2626" font-family="sans-serif" font-size="16">mg</text>
  <text x="326" y="236" fill="#059669" font-family="sans-serif" font-size="16">N</text>
  <text x="96" y="114" fill="#475569" font-family="sans-serif" font-size="16">θ</text>
  <text x="196" y="306" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">m</text>
  <text x="540" y="368" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="14">Inclined plane</text>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
  </defs>
</svg>
